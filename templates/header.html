<header class="site-header">
  <a href="/" class="home-link" aria-label="Home">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <defs>
        <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" class="logo-top"/>
          <stop offset="100%" class="logo-bottom"/>
        </linearGradient>
      </defs>
      <!-- Badge background -->
      <rect width="32" height="32" rx="7" fill="url(#hbg)"/>
      <!-- House roof -->
      <polygon points="16,6 27,15 5,15" class="logo-mark"/>
      <!-- House body -->
      <rect x="7" y="15" width="18" height="12" rx="1" class="logo-mark"/>
      <!-- Door -->
      <rect x="13" y="19" width="6" height="8" rx="1" class="logo-detail"/>
      <!-- Windows -->
      <rect x="8"  y="17" width="4" height="3" rx="0.5" class="logo-detail" opacity="0.55"/>
      <rect x="20" y="17" width="4" height="3" rx="0.5" class="logo-detail" opacity="0.55"/>
    </svg>
  </a>
  <span class="command-heading">{{COMMAND_HEADING}}</span>
  <command-search></command-search>
  <theme-picker></theme-picker>
    <a href="https://www.buymeacoffee.com/computerguycj" target="_blank" rel="noopener" class="bmc-link" aria-label="Buy me a coffee">
    <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png"
         alt="Buy Me A Coffee"
         height="36">
  </a>
</header>
