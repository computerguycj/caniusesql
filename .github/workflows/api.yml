# The .NET API (server/): test, build the container image, push it to GHCR,
# deploy it to Azure Container Apps. Pull requests stop after building the
# image; only main pushes and deploys.
name: API

on:
  push:
    branches: [main]
    paths: [server/**, data.json, .dockerignore, .github/workflows/api.yml]
  pull_request:
    paths: [server/**, data.json, .dockerignore, .github/workflows/api.yml]
  workflow_dispatch:

# Least privilege: jobs ask for more only where they need it.
permissions:
  contents: read

# One run per branch at a time; a newer push cancels an older PR run, but
# never a deploy in progress on main.
concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR with the workflow's own token
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags are for people (sha-<short sha>, and latest on main). The deploy
      # uses the digest, which can't be moved to other content.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Skipped until the Azure setup (chunk 5) sets the repository variables.
  # Signs in with OpenID Connect: Azure trusts this repo's main branch
  # directly, so no Azure password or key is stored in GitHub.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.AZURE_CONTAINER_APP != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write  # request the OIDC token Azure verifies
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the container app at the new image
        run: >
          az containerapp update
          --name "$APP" --resource-group "$GROUP"
          --image "$IMAGE@$DIGEST"
        env:
          APP: ${{ vars.AZURE_CONTAINER_APP }}
          GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DIGEST: ${{ needs.image.outputs.digest }}
